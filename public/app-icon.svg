<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Base Dark Matte Squircle Gradient -->
    <linearGradient id="bgTile" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2330" />
      <stop offset="35%" stop-color="#141824" />
      <stop offset="70%" stop-color="#0D101A" />
      <stop offset="100%" stop-color="#080A10" />
    </linearGradient>

    <!-- Radial Ambient Center Soft Lighting -->
    <radialGradient id="ambientLight" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.08" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Outer Bevel Rim -->
    <linearGradient id="rimBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.18)" />
      <stop offset="40%" stop-color="rgba(255, 255, 255, 0.05)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0.8)" />
    </linearGradient>

    <!-- Deep Drop Shadow for Capsules -->
    <filter id="pillShadow" x="-40%" y="-20%" width="180%" height="160%">
      <feDropShadow dx="8" dy="16" stdDeviation="12" flood-color="#020306" flood-opacity="0.75" />
    </filter>

    <!-- Specular White Rim Gradient for Left Highlight -->
    <linearGradient id="whiteRimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>

    <!-- Top Cap Curved Highlight Gradient -->
    <linearGradient id="capHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- 1. Cyan Glow (Left - Shortest) -->
    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="30%" stop-color="#06B6D4" />
      <stop offset="70%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="pillBottom1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <!-- 2. Azure Sky Blue (Mid-Left) -->
    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="28%" stop-color="#0284C7" />
      <stop offset="65%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <linearGradient id="pillBottom2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0" />
    </linearGradient>

    <!-- 3. Royal Indigo / Violet (Mid-Right) -->
    <linearGradient id="pillGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="28%" stop-color="#6366F1" />
      <stop offset="65%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="pillBottom3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#A5B4FC" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#A5B4FC" stop-opacity="0" />
    </linearGradient>

    <!-- 4. Vivid Magenta / Purple (Right - Tallest) -->
    <linearGradient id="pillGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="25%" stop-color="#D946EF" />
      <stop offset="65%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#581C87" />
    </linearGradient>
    <linearGradient id="pillBottom4" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F0ABFC" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#F0ABFC" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Outer Squircle Card -->
  <rect x="8" y="8" width="496" height="496" rx="136" fill="url(#rimBevel)" />
  <rect x="12" y="12" width="488" height="488" rx="132" fill="url(#bgTile)" />
  <rect x="12" y="12" width="488" height="488" rx="132" fill="url(#ambientLight)" />

  <!-- Ambient Pill Glow Underlay -->
  <ellipse cx="256" cy="270" rx="140" ry="110" fill="#38BDF8" fill-opacity="0.08" />
  <ellipse cx="330" cy="230" rx="110" ry="90" fill="#C084FC" fill-opacity="0.08" />

  <!-- BAR 1: CYAN NEON (x=122, w=54, y=232, h=140, bottom=372) -->
  <g filter="url(#pillShadow)">
    <rect x="122" y="232" width="54" height="140" rx="27" fill="url(#pillGrad1)" />
    <rect x="124" y="312" width="50" height="58" rx="25" fill="url(#pillBottom1)" opacity="0.6" />
    <path d="M 130 258 L 130 346" stroke="url(#whiteRimGrad)" stroke-width="3.2" stroke-linecap="round" />
    <path d="M 127 248 C 132 238, 166 238, 171 248 C 165 244, 133 244, 127 248 Z" fill="url(#capHighlight)" />
    <ellipse cx="149" cy="242" rx="16" ry="6" fill="#FFFFFF" fill-opacity="0.45" />

    <circle cx="140" cy="268" r="2.2" fill="#FFFFFF" fill-opacity="0.85" />
    <circle cx="156" cy="296" r="1.6" fill="#FFFFFF" fill-opacity="0.6" />
    <circle cx="138" cy="328" r="2.0" fill="#FFFFFF" fill-opacity="0.75" />
    <circle cx="152" cy="350" r="1.4" fill="#FFFFFF" fill-opacity="0.5" />
  </g>

  <!-- BAR 2: AZURE SKY BLUE (x=194, w=54, y=188, h=214, bottom=402) -->
  <g filter="url(#pillShadow)">
    <rect x="194" y="188" width="54" height="214" rx="27" fill="url(#pillGrad2)" />
    <rect x="196" y="320" width="50" height="80" rx="25" fill="url(#pillBottom2)" opacity="0.65" />
    <path d="M 202 216 L 202 376" stroke="url(#whiteRimGrad)" stroke-width="3.2" stroke-linecap="round" />
    <path d="M 199 204 C 204 194, 238 194, 243 204 C 237 200, 205 200, 199 204 Z" fill="url(#capHighlight)" />
    <ellipse cx="221" cy="198" rx="16" ry="6" fill="#FFFFFF" fill-opacity="0.45" />

    <circle cx="212" cy="226" r="2.4" fill="#FFFFFF" fill-opacity="0.8" />
    <circle cx="230" cy="268" r="1.8" fill="#FFFFFF" fill-opacity="0.7" />
    <circle cx="210" cy="316" r="2.2" fill="#FFFFFF" fill-opacity="0.65" />
    <circle cx="228" cy="354" r="1.6" fill="#FFFFFF" fill-opacity="0.8" />
    <circle cx="216" cy="382" r="1.4" fill="#FFFFFF" fill-opacity="0.55" />
  </g>

  <!-- BAR 3: ROYAL INDIGO / VIOLET (x=266, w=54, y=148, h=212, bottom=360) -->
  <g filter="url(#pillShadow)">
    <rect x="266" y="148" width="54" height="212" rx="27" fill="url(#pillGrad3)" />
    <rect x="268" y="278" width="50" height="80" rx="25" fill="url(#pillBottom3)" opacity="0.65" />
    <path d="M 274 176 L 274 334" stroke="url(#whiteRimGrad)" stroke-width="3.2" stroke-linecap="round" />
    <path d="M 271 164 C 276 154, 310 154, 315 164 C 309 160, 277 160, 271 164 Z" fill="url(#capHighlight)" />
    <ellipse cx="293" cy="158" rx="16" ry="6" fill="#FFFFFF" fill-opacity="0.45" />

    <circle cx="284" cy="186" r="2.2" fill="#FFFFFF" fill-opacity="0.85" />
    <circle cx="302" cy="228" r="1.8" fill="#FFFFFF" fill-opacity="0.75" />
    <circle cx="282" cy="274" r="2.4" fill="#FFFFFF" fill-opacity="0.7" />
    <circle cx="300" cy="318" r="1.6" fill="#FFFFFF" fill-opacity="0.6" />
    <circle cx="288" cy="342" r="1.4" fill="#FFFFFF" fill-opacity="0.5" />
  </g>

  <!-- BAR 4: VIVID MAGENTA / PURPLE (x=338, w=54, y=112, h=198, bottom=310) -->
  <g filter="url(#pillShadow)">
    <rect x="338" y="112" width="54" height="198" rx="27" fill="url(#pillGrad4)" />
    <rect x="340" y="230" width="50" height="78" rx="25" fill="url(#pillBottom4)" opacity="0.7" />
    <path d="M 346 140 L 346 284" stroke="url(#whiteRimGrad)" stroke-width="3.2" stroke-linecap="round" />
    <path d="M 343 128 C 348 118, 382 118, 387 128 C 381 124, 349 124, 343 128 Z" fill="url(#capHighlight)" />
    <ellipse cx="365" cy="122" rx="16" ry="6" fill="#FFFFFF" fill-opacity="0.5" />

    <circle cx="356" cy="150" r="2.4" fill="#FFFFFF" fill-opacity="0.9" />
    <circle cx="374" cy="192" r="1.7" fill="#FFFFFF" fill-opacity="0.8" />
    <circle cx="352" cy="236" r="2.5" fill="#FFFFFF" fill-opacity="0.7" />
    <circle cx="372" cy="274" r="1.6" fill="#FFFFFF" fill-opacity="0.6" />
    <circle cx="360" cy="294" r="1.4" fill="#FFFFFF" fill-opacity="0.5" />
  </g>
</svg>

