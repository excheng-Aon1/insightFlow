# ==============================================================================
# Render / Cloud Blueprint for InsightFlow Enterprise Backend
# รันผ่าน Gunicorn ร่วมกับ Uvicorn Workers พร้อมเชื่อมต่อ PostgreSQL และ Redis
# ==============================================================================
services:
  - type: web
    name: insightflow-enterprise-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --config gunicorn_conf.py --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: WEB_CONCURRENCY
        value: "4"
      - key: GUNICORN_THREADS
        value: "2"
      - key: GUNICORN_TIMEOUT
        value: "120"
      - key: GUNICORN_MAX_REQUESTS
        value: "2000"
      - key: GUNICORN_MAX_REQUESTS_JITTER
        value: "200"
      - key: DB_POOL_SIZE
        value: "30"
      - key: DB_MAX_OVERFLOW
        value: "70"
      - key: OTP_TTL_SECONDS
        value: "180"
      - key: OTP_RATE_LIMIT
        value: "3/5minutes"
      - key: ALGORITHM
        value: "HS256"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"

